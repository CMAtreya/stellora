<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STELLORA - AI Travel Companion | Never Waste Time Traveling Again</title>
    <meta
      name="description"
      content="STELLORA is an AI travel companion delivering adaptive itineraries, cultural storytelling, and offline-first navigation so you never waste time traveling again."
    />
    <meta
      name="keywords"
      content="AI travel companion, adaptive itineraries, cultural storytelling, offline maps, smart navigation, Mysuru travel, India travel tech"
    />
    <meta name="author" content="STELLORA" />
    <meta name="theme-color" content="#0A1128" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="canonical" href="https://www.stellora.com/" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STELLORA - AI Travel Companion" />
    <meta
      property="og:description"
      content="Adaptive itineraries, GPS-triggered stories, and offline-first navigation for effortless travel."
    />
    <meta property="og:url" content="https://www.stellora.com/" />
    <meta property="og:image" content="https://www.stellora.com/og-hero.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STELLORA - AI Travel Companion" />
    <meta
      name="twitter:description"
      content="Adaptive itineraries, cultural storytelling, and offline navigation for travelers who hate wasting time."
    />
    <meta name="twitter:image" content="https://www.stellora.com/og-hero.jpg" />

    <!-- Preconnects for faster font fetching -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "STELLORA",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "10000"
        }
      }
    </script>

    <!-- Analytics stub (disabled until configured) -->
    <script>
      window.analyticsQueue = window.analyticsQueue || [];
      window.analytics = {
        track: function (event, payload) {
          window.analyticsQueue.push({ event: event, payload: payload, ts: Date.now() });
        }
      };
      // Note: external analytics loader removed to avoid DNS errors.
      // Provide a real CDN URL and site id, then re-enable the loader.
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
